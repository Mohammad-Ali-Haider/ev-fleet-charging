server.port=8106
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://127.0.0.1:5546/evfleet_java}
spring.datasource.username=${DB_USER:evfleet}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.connection-timeout=2000
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
# One JSON object per log line (Elastic Common Schema), including the key-value fields added in code.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=ev-fleet
logging.level.root=WARN
logging.level.com.moveinsync.evfleet=INFO
springdoc.swagger-ui.path=/docs
# Schema migrations (src/main/resources/db/migration). A database created before Flyway already
# holds the version 1 tables, so it is recorded as version 1 instead of being migrated.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
